spring.application.name=neofluxo-test

# In-Memory H2 Database with MySQL compatibility mode for JPA tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration for test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled in test (Hibernate create-drop handles test schema)
spring.flyway.enabled=false

# JWT Test configuration
app.jwt.secret=test-secret-key-for-unit-and-integration-tests-minimum-256-bits-ok
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173
