spring.application.name=neofluxo

# Conexão com o banco de dados MySQL via Docker
spring.datasource.url=jdbc:mysql://localhost:3306/neofluxo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife
spring.datasource.username=neofluxo
spring.datasource.password=neofluxo123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (cria/atualiza as tabelas automaticamente baseado nas suas classes @Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
