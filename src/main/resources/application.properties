spring.application.name=neofluxo

# ==================== DATASOURCE ====================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/neofluxo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neofluxo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:neofluxo123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==================== FLYWAY ====================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==================== SERVER ====================
server.port=8080

# ==================== CORS ====================
# Permite o frontend (porta 5173) acessar a API
app.cors.allowed-origins=http://localhost:5173,http://frontend:80
