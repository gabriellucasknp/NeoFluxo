spring.application.name=neofluxo

# MySQL via Docker
spring.datasource.url=jdbc:mysql://mysql:3306/neofluxo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife
spring.datasource.username=neofluxo
spring.datasource.password=neofluxo123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# true: os controllers montam a resposta com relações LAZY (Project -> User)
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173
server.port=8080

# E-mail (US-02: recuperação de senha). Credenciais só por variável de ambiente (.env na raiz, ver .env.example).
# Sem MAIL_USERNAME o back sobe normal e o link de redefinição sai no log (WARN) em vez de e-mail.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# remetente; vazio = o próprio MAIL_USERNAME
app.mail.from=${MAIL_FROM:}
# base do link que vai no e-mail: <APP_FRONTEND_URL>/redefinir-senha?token=...
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
