version: '3.8'

services:
  # ===================== BANCO DE DADOS =====================
  db:
    image: mysql:8.0
    container_name: neofluxo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: neofluxo_db
      MYSQL_USER: neofluxo
      MYSQL_PASSWORD: neofluxo123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== BACKEND (Spring Boot) =====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neofluxo-backend
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      APP_JWT_SECRET: "neofluxo-jwt-secret-2026-9f8a7c6d5e4b3a2f1e0d9c8b7a6f5e4d3c2b1a0"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/neofluxo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife
      SPRING_DATASOURCE_USERNAME: neofluxo
      SPRING_DATASOURCE_PASSWORD: neofluxo123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
    depends_on:
      db:
        condition: service_healthy

  # ===================== FRONTEND (React/Vite) =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neofluxo-frontend
    restart: on-failure
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
